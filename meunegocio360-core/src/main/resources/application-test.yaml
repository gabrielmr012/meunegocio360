spring:
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meunegocio360_core}
    username: ${DB_USER:meunegocio360}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

  jpa:
    hibernate:
      ddl-auto: validate

app:
  auth:
    jwt:
      secret: dGVzdC1qd3Qtc2VjcmV0LXdoaWNoLWlzLWF0LWxlYXN0LTMtYnl0ZXMtbG9uZw==
    cookie:
      secure: false

logging:
  structured:
    format:
      console: logstash
  level:
    br.com.meunegocio360: DEBUG
