spring:
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${CORE_DB_PORT:5432}/${CORE_DB_NAME:meunegocio360_core}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: false

app:
  auth:
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:false}

logging:
  level:
    br.com.meunegocio360: DEBUG
    org.hibernate.SQL: DEBUG
